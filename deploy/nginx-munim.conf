# /etc/nginx/sites-available/munim  (symlinked into sites-enabled by deploy/setup.sh)
#
# Public door for the Munim dashboard. The app itself listens on 127.0.0.1:8788 only.
# Shipped as plain HTTP on purpose: certbot adds the 443 server block, the certificate
# paths and the http->https redirect to THIS file. Issue the certificate with:
#
#   certbot --nginx -d munim.heneryshop.com --redirect
#
# (setup.sh runs that for you once DNS resolves to this box.) After certbot has edited
# this file, setup.sh will not overwrite it again.
#
# The dashboard has its own login (DASHBOARD_PASSWORD -> session cookie). For a second
# layer, add to the location block:   auth_basic "munim"; auth_basic_user_file /etc/nginx/munim.htpasswd;
# (create the file with:  printf 'munim:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/munim.htpasswd)

# Unique variable name so it cannot clash with other sites' websocket maps on this box.
map $http_upgrade $munim_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name munim.heneryshop.com;

    server_tokens off;
    client_max_body_size 1m;

    # Security headers (inherited by the location below because it sets none itself).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # websocket-safe
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $munim_connection_upgrade;

        # /export.csv syncs the view wallet first and can take up to 5 minutes.
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
    }
}
